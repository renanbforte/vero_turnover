# =============================================================================
# pyproject.toml — as dependencias deste servidor, e SO elas
# -----------------------------------------------------------------------------
# A lista e menor que a do repositorio de estudo porque este projeto faz uma
# coisa so: servir o painel e o chat de retencao. Cada linha que saiu tinha um
# motivo:
#
#   httpx, beautifulsoup4     eram das ferramentas de CEP/CNPJ/cotacao
#   docx2txt, pypdf           eram da ingestao de documentos no RAG
#   langchain-mcp-adapters    era do conector de MCP
#   matplotlib                era dos graficos do deck -- o painel desenha SVG
#                             no navegador e nao precisa de biblioteca grafica
#
# Dependencia a menos nao e economia de disco: e uma coisa a menos para receber
# CVE, para quebrar em atualizacao e para explicar depois.
# =============================================================================

[project]
name = "vero-turnover"
version = "1.0.0"
description = "Painel de retenção e agente de diretoria — case de turnover"
requires-python = ">=3.12"

dependencies = [
    # --- servidor -----------------------------------------------------------
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-dotenv>=1.2.3",

    # --- agente -------------------------------------------------------------
    "langchain>=1.3.15",
    "langchain-openai>=1.5.2",
    "langgraph-checkpoint-postgres>=3.1.2",

    # --- banco --------------------------------------------------------------
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.2",

    # --- analise ------------------------------------------------------------
    # `statsmodels` e o que faz a regressao logistica do grafico de fatores.
    # `openpyxl` so e usado na carga inicial, para ler a planilha.
    "pandas>=2.2",
    "numpy>=2.1",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
]
